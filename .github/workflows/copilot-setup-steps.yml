# Prepares the Copilot cloud agent sandbox so agents can run the exact gate CI runs.
name: Copilot Setup Steps
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v6
      - name: Make harness scripts executable
        run: chmod +x scripts/*.sh scripts/*.py scripts/hooks/* .specify/scripts/bash/*.sh 2>/dev/null || true
      - name: Install project dependencies
        run: bash scripts/verify.sh --no-e2e >/dev/null 2>&1 || echo "verify not green yet; deps installed where possible"
      - name: Playwright browsers (if used)
        run: |
          if ls playwright.config.* >/dev/null 2>&1; then npx --yes playwright install --with-deps chromium; fi
