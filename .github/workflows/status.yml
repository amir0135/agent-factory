# The owner dashboard: one pinned "📊 Status" issue, rewritten in place.
# Plain script, no LLM and no premium requests. Runs in seconds.
name: status
on:
  push:
    branches: [main]
  issues:
    types: [opened, closed, labeled, unlabeled, assigned]
  pull_request:
    types: [opened, closed]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
  pull-requests: read
concurrency:
  group: status
  cancel-in-progress: true
jobs:
  update:
    # Never react to the Status issue updating itself.
    if: github.event_name != 'issues' || !contains(github.event.issue.labels.*.name, 'status')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update the pinned Status issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/status.py
