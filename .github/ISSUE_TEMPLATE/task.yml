name: Build task
description: One independently verifiable unit of work (normally created by the Backlog Dispatcher)
title: "[NNN-USx] "
labels: [agent-task]
body:
  - type: textarea
    id: context
    attributes: { label: CONTEXT, description: "Why this exists. Link spec / plan / parent issue." }
    validations: { required: true }
  - type: textarea
    id: requirement
    attributes: { label: REQUIREMENT, description: "What must be true when done. Task IDs from tasks.md (T0xx)." }
    validations: { required: true }
  - type: textarea
    id: acs
    attributes: { label: ACCEPTANCE CRITERIA, description: "AC IDs from product/ACCEPTANCE_CRITERIA.md" }
    validations: { required: true }
  - type: input
    id: deps
    attributes: { label: DEPENDENCIES, placeholder: "#12, #13 or none" }
  - type: textarea
    id: files
    attributes: { label: FILES/COMPONENTS LIKELY INVOLVED }
  - type: textarea
    id: verification
    attributes:
      label: VERIFICATION
      value: |
        - [ ] `bash scripts/verify.sh`
        - [ ] `python3 scripts/check_acceptance.py`
        - [ ] listed ACs flipped to done with passing verify commands
